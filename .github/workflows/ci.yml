name: Test and publish

on:
  push:
    branches: [master]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs before an older build can publish over a newer one.
# Keep manual checks independent from publishing push runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Classify release
        if: github.event_name == 'release'
        id: release
        uses: actions/github-script@v9
        with:
          script: |
            const { tag_name: tag, prerelease } = context.payload.release;
            if (!tag.startsWith('v') || tag.includes('+')) {
              throw new Error('Use a v-prefixed SemVer tag without build metadata');
            }
            // metadata-action validates SemVer; a flag or suffix makes it a prerelease.
            const stable = !prerelease && !tag.includes('-');
            core.setOutput('stable', stable);
            // Pre-1.0 releases do not promise compatibility across minor versions.
            core.setOutput('aliases', stable && !tag.startsWith('v0.'));
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ steps.release.outputs.aliases == 'true' }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }},enable=${{ steps.release.outputs.aliases == 'true' }}
          flavor: latest=false

  build:
    name: Build and test / ${{ matrix.arch }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.x'
          check-latest: true
          cache: true
          cache-dependency-path: |
            integration/go.mod
            integration/go.sum
            integration/**/*.go
      - name: Check formatting
        if: matrix.arch == 'amd64'
        run: test -z "$(gofmt -l cmd internal integration examples/basic)"
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - name: Build and unit-test the native image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: |
            type=oci,dest=${{ runner.temp }}/docktinel-${{ matrix.arch }}.tar
            type=local,dest=${{ runner.temp }}/image-root,platform-split=false
          labels: ${{ needs.metadata.outputs.labels }}
          build-args: VERSION=${{ github.event.release.tag_name || github.ref_name }}
          # Re-run tests on every CI build; reuse their compiled test binaries.
          no-cache-filters: test
          cache-from: type=gha,scope=docktinel-${{ matrix.arch }}
          cache-to: type=gha,scope=docktinel-${{ matrix.arch }},mode=max
          provenance: mode=max
          sbom: true
      - name: Unpack the image for Buildx
        run: |
          mkdir -p "$RUNNER_TEMP/docktinel-image"
          tar -xf "$RUNNER_TEMP/docktinel-$BUILD_ARCH.tar" -C "$RUNNER_TEMP/docktinel-image"
      - name: Expose Buildx cache credentials
        uses: actions/github-script@v9
        with:
          script: |
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
      - name: Build test environment from the archived image
        run: make demo
        env:
          DOCKTINEL_IMAGE: docktinel-source
          DEMO_BUILD_FLAGS: >-
            --builder ${{ steps.buildx.outputs.name }}
            --build-context docktinel-source=oci-layout://${{ runner.temp }}/docktinel-image
            --cache-from type=gha,version=2,scope=docktinel-demo-${{ runner.arch }}
            --cache-to type=gha,version=2,scope=docktinel-demo-${{ runner.arch }},mode=max
      - run: make integration-test
      - name: Collect the tested binary
        run: cp "$RUNNER_TEMP/image-root/usr/local/bin/docktinel" "$RUNNER_TEMP/docktinel-linux-$BUILD_ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binary-${{ matrix.arch }}
          path: ${{ runner.temp }}/docktinel-linux-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: container-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/docktinel-${{ matrix.arch }}.tar
          compression-level: 0
          if-no-files-found: error
          overwrite: true

  package-binaries:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: linux-binary-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum docktinel-linux-amd64 docktinel-linux-arm64 > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: dist/
          if-no-files-found: error
          overwrite: true

  publish:
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: [metadata, build]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ needs.metadata.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      stable: ${{ needs.metadata.outputs.stable }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: container-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Install regctl
        run: |
          curl -fsSL --connect-timeout 5 --max-time 30 --retry 2 https://github.com/regclient/regclient/releases/download/v0.11.6/regctl-linux-amd64 -o "$RUNNER_TEMP/regctl"
          echo "8e0e62a497fcdb8048d18aa927a139613176ba0531f412bc541044e28f9856bd  $RUNNER_TEMP/regctl" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish a multi-platform index from the tested images
        id: publish
        env:
          TAGS: ${{ needs.metadata.outputs.tags }}
        run: bash scripts/ci-publish.sh "$RUNNER_TEMP/images"

  release-binaries:
    if: github.event_name == 'release'
    needs: [package-binaries, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: dist
      - name: Attach binaries and checksums to the release
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum --check SHA256SUMS
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          missing=()
          for file in docktinel-linux-amd64 docktinel-linux-arm64 SHA256SUMS; do
            if grep -Fxq -- "$file" <<< "$assets"; then
              gh release download "$RELEASE_TAG" --pattern "$file" --output "$RUNNER_TEMP/$file"
              if ! cmp -s "$file" "$RUNNER_TEMP/$file"; then
                echo "::error::Existing release asset $file differs from the tested artifact"
                exit 1
              fi
            else
              missing+=("$file")
            fi
          done
          if (( ${#missing[@]} )); then
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi

  promote-latest:
    if: github.event_name == 'release' && needs.publish.outputs.stable == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Different release tags share latest. Check the current selection while
    # holding this group; never cancel a manifest update already in progress.
    concurrency:
      group: ${{ github.workflow }}-ghcr-latest
      cancel-in-progress: false
    steps:
      - name: Check GitHub Latest release
        id: latest
        uses: actions/github-script@v9
        with:
          script: |
            const { data: latest } = await github.rest.repos.getLatestRelease(context.repo)
              .catch(error => {
                if (error.status !== 404) throw error;
                return { data: null };
              });
            core.setOutput('promote', latest?.id === context.payload.release.id);
      - uses: docker/setup-buildx-action@v4
        if: steps.latest.outputs.promote == 'true'
      - uses: docker/login-action@v4
        if: steps.latest.outputs.promote == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote published digest to latest
        if: steps.latest.outputs.promote == 'true'
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
