name: Test and publish

on:
  push:
    branches: [master]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs before an older build can publish over a newer one.
# Keep manual checks independent from publishing push runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.x'
          check-latest: true
          # Formatting only; compilation caches are managed by Docker below.
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal integration examples/basic)"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
      stable: ${{ steps.release.outputs.stable }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Classify release
        if: github.event_name == 'release'
        id: release
        uses: actions/github-script@v9
        with:
          script: |
            const { tag_name: tag, prerelease } = context.payload.release;
            if (!tag.startsWith('v') || tag.includes('+')) {
              throw new Error('Use a v-prefixed SemVer tag without build metadata');
            }
            // metadata-action validates SemVer; a flag or suffix makes it a prerelease.
            const stable = !prerelease && !tag.includes('-');
            core.setOutput('stable', stable);
            // Pre-1.0 releases do not promise compatibility across minor versions.
            core.setOutput('aliases', stable && !tag.startsWith('v0.'));
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ steps.release.outputs.aliases == 'true' }}
            type=semver,pattern={{major}},value=${{ github.event.release.tag_name }},enable=${{ steps.release.outputs.aliases == 'true' }}
          flavor: latest=false
      - name: Build image and extract binaries once
        uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: |
            type=oci,dest=${{ runner.temp }}/docktinel-image.tar
            type=local,dest=${{ runner.temp }}/image-root
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.event.release.tag_name || github.ref_name }}
          # Re-run tests on every CI build; reuse their compiled test binaries.
          no-cache-filters: test
          cache-from: |
            type=gha,scope=docktinel
            type=gha
          cache-to: type=gha,scope=docktinel,mode=max
          provenance: mode=max
          sbom: true
      - name: Collect binaries from the image filesystem
        env:
          IMAGE_ROOT: ${{ runner.temp }}/image-root
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            cp "$IMAGE_ROOT/linux_$arch/usr/local/bin/docktinel" "dist/docktinel-linux-$arch"
          done
          cd dist
          sha256sum docktinel-linux-* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: dist/
      - uses: actions/upload-artifact@v7
        with:
          name: container-image
          path: ${{ runner.temp }}/docktinel-image.tar
          compression-level: 0

  integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.x'
          check-latest: true
          cache: true
          cache-dependency-path: |
            integration/go.mod
            integration/go.sum
            integration/**/*.go
      - uses: actions/download-artifact@v8
        with:
          name: container-image
          path: ${{ runner.temp }}
      - name: Unpack the image for Buildx
        run: |
          mkdir -p "$RUNNER_TEMP/docktinel-image"
          tar -xf "$RUNNER_TEMP/docktinel-image.tar" -C "$RUNNER_TEMP/docktinel-image"
      - uses: docker/setup-buildx-action@v4
      - name: Build test environment from the image artifact
        uses: docker/bake-action@v7
        env:
          DOCKTINEL_SOURCE: oci-layout://${{ runner.temp }}/docktinel-image
        with:
          source: .
          allow: fs.read=${{ runner.temp }}/docktinel-image
          targets: demo
          load: true
          set: |
            demo.cache-from=type=gha,scope=docktinel-demo-${{ runner.arch }}
            demo.cache-to=type=gha,scope=docktinel-demo-${{ runner.arch }},mode=max
      - run: make integration-test

  publish:
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: [build, integration]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ needs.build.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
      stable: ${{ needs.build.outputs.stable }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: container-image
          path: ${{ runner.temp }}
      - name: Install OCI image copier
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | skopeo login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Publish the tested image without rebuilding
        id: publish
        env:
          TAGS: ${{ needs.build.outputs.tags }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          test -n "$TAGS"
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --all --preserve-digests --digestfile "$RUNNER_TEMP/published.digest" \
              "oci-archive:$RUNNER_TEMP/docktinel-image.tar" "docker://$tag"
          done <<< "$TAGS"
          digest=$(cat "$RUNNER_TEMP/published.digest")
          test "$digest" = "$EXPECTED_DIGEST"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  promote-latest:
    if: github.event_name == 'release' && needs.publish.outputs.stable == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Different release tags share latest. Check the current selection while
    # holding this group; never cancel a manifest update already in progress.
    concurrency:
      group: ${{ github.workflow }}-ghcr-latest
      cancel-in-progress: false
    steps:
      - name: Check GitHub Latest release
        id: latest
        uses: actions/github-script@v9
        with:
          script: |
            const { data: latest } = await github.rest.repos.getLatestRelease(context.repo)
              .catch(error => {
                if (error.status !== 404) throw error;
                return { data: null };
              });
            core.setOutput('promote', latest?.id === context.payload.release.id);
      - uses: docker/setup-buildx-action@v4
        if: steps.latest.outputs.promote == 'true'
      - uses: docker/login-action@v4
        if: steps.latest.outputs.promote == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote published digest to latest
        if: steps.latest.outputs.promote == 'true'
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
