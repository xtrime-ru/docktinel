name: Test and publish

on:
  push:
    branches: [master]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs before an older build can publish over a newer one.
# Keep manual checks independent from publishing push runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal integration examples/basic)"
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - name: Cross-compile static Linux binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/docktinel-linux-$arch" ./cmd/docktinel
          done
          cd dist
          sha256sum docktinel-linux-* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: dist/

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache-dependency-path: integration/go.sum
      - uses: docker/setup-buildx-action@v4
      - run: make integration

  publish:
    if: github.event_name == 'push' || github.event_name == 'release'
    needs: [test, integration]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      stable: ${{ steps.release.outputs.stable }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Classify release
        if: github.event_name == 'release'
        id: release
        uses: actions/github-script@v9
        with:
          script: |
            const { tag_name: tag, prerelease } = context.payload.release;
            if (!tag.startsWith('v') || tag.includes('+')) {
              throw new Error('Use a v-prefixed SemVer tag without build metadata');
            }
            // metadata-action validates SemVer; a flag or suffix makes it a prerelease.
            core.setOutput('stable', !prerelease && !tag.includes('-'));
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }},enable=${{ steps.release.outputs.stable == 'true' }}
          flavor: latest=false
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.event.release.tag_name || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  promote-latest:
    if: github.event_name == 'release' && needs.publish.outputs.stable == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Different release tags share latest. Check the current selection while
    # holding this group; never cancel a manifest update already in progress.
    concurrency:
      group: ${{ github.workflow }}-ghcr-latest
      cancel-in-progress: false
    steps:
      - name: Check GitHub Latest release
        id: latest
        uses: actions/github-script@v9
        with:
          script: |
            const { data: latest } = await github.rest.repos.getLatestRelease(context.repo)
              .catch(error => {
                if (error.status !== 404) throw error;
                return { data: null };
              });
            core.setOutput('promote', latest?.id === context.payload.release.id);
      - uses: docker/setup-buildx-action@v4
        if: steps.latest.outputs.promote == 'true'
      - uses: docker/login-action@v4
        if: steps.latest.outputs.promote == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote published digest to latest
        if: steps.latest.outputs.promote == 'true'
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
